name: Media Analysis offline tests

on:
  push:
    paths:
      - 'media-analysis/**'
      - '.github/workflows/media-analysis-tests.yml'
  pull_request:
    paths:
      - 'media-analysis/**'
      - '.github/workflows/media-analysis-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test requirements
        run: python -m pip install pytest Pillow beautifulsoup4
      - name: Run offline tests
        run: python -m pytest -q media-analysis/tests/test_media_analysis.py
